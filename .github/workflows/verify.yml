name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 版本照根目錄 package.json 的 packageManager
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # 05 加模擬器時，這裡要補 actions/setup-java（JDK 21）
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
